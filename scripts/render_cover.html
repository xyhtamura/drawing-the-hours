<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drawing the Hours OST Cover Generator</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; padding: 20px; }
    #log { font-family: monospace; white-space: pre-wrap; }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>Rendering Drawing the Hours Album Covers (3000 x 3000)...</h1>
  <pre id="log">Starting...</pre>

  <script type="module">
    import { CHAPTER_PALETTES } from '../src/palettes.js';
    import { paperBackdrop, onPapersArrived, loadAllPapers } from '../src/paper.js';
    import { Insect } from '../src/entities.js';

    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
      fetch('/api/progress', { method: 'POST', body: msg }).catch(() => {});
    }

    const HOURS = ['dawn', 'noon', 'dusk', 'midnight'];
    const FLIERS = ['brimstone', 'damselfly', 'hawkmoth', 'hoverfly', 'lacewing', 'firefly'];
    const CORD_COLORS = [[190, 86, 68], [204, 147, 63], [95, 143, 91], [57, 133, 143], [111, 93, 151], [180, 99, 136]];

    function lcg(seed) {
      return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    }

    function loadImg(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed to load ' + src));
        img.src = src;
      });
    }

    /** Chamfer distance cord shading from src/title-lettering.js */
    function cordPixels(mask) {
      const { width, height, data } = mask;
      const distance = new Float32Array(width * height);
      for (let i = 0; i < distance.length; i++) distance[i] = data[i * 4 + 3] > 100 ? 1000 : 0;
      for (let y = 1; y < height; y++) for (let x = 1; x < width; x++) {
        const i = y * width + x;
        distance[i] = Math.min(distance[i], distance[i - 1] + 1, distance[i - width] + 1, distance[i - width - 1] + Math.SQRT2);
      }
      for (let y = height - 2; y >= 0; y--) for (let x = width - 2; x >= 0; x--) {
        const i = y * width + x;
        distance[i] = Math.min(distance[i], distance[i + 1] + 1, distance[i + width] + 1, distance[i + width + 1] + Math.SQRT2);
      }
      for (let y = 1; y < height - 1; y++) for (let x = 1; x < width - 1; x++) {
        const i = y * width + x, p = i * 4;
        if (!data[p + 3]) continue;
        const phase = (x + y * .42) / 115;
        const step = Math.floor(phase), blend = phase - step;
        const a = CORD_COLORS[step % CORD_COLORS.length], b = CORD_COLORS[(step + 1) % CORD_COLORS.length];
        const nx = (distance[i - 1] - distance[i + 1]) / 2;
        const ny = (distance[i - width] - distance[i + width]) / 2;
        const edge = Math.max(0, 1 - distance[i] / 5);
        const light = .93 + (-nx * .5 - ny * .7) * edge * .3;
        const twist = Math.sin(x * 1.15 + y * .9) * .075;
        const fibre = Math.sin(x * 12.9898 + y * 78.233) * .025;
        for (let c = 0; c < 3; c++) {
          const color = a[c] + (b[c] - a[c]) * blend;
          data[p + c] = Math.max(0, Math.min(255, color * (light + twist + fibre) + (1 - edge) * 15));
        }
      }
      return mask;
    }

    function hourSheet(hour, width, height) {
      const canvas = Object.assign(document.createElement('canvas'), { width, height });
      const ctx = canvas.getContext('2d');
      const p = CHAPTER_PALETTES[hour];
      const wash = ctx.createLinearGradient(0, 0, width, height);
      wash.addColorStop(0, p.top); wash.addColorStop(0.5, p.middle); wash.addColorStop(1, p.bottom);
      ctx.fillStyle = wash; ctx.fillRect(0, 0, width, height);
      paperBackdrop(canvas, hour, undefined, 'portrait');
      return canvas;
    }

    function loopPath(ctx, cx, cy, rx, ry, rand) {
      const n = 12, wobble = Array.from({ length: n }, () => 0.93 + rand() * 0.14);
      const point = (i) => {
        const a = -2.4 + (i / n) * Math.PI * 2, k = wobble[i % n] * (1 + i / n * 0.05);
        return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k];
      };
      ctx.beginPath();
      let [px, py] = point(0);
      ctx.moveTo(px, py);
      for (let i = 1; i <= n + 2; i++) {
        const [x, y] = point(i);
        ctx.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2);
        px = x; py = y;
      }
    }

    function drawLetterspacedText(ctx, text, x, y, letterSpacing) {
      const chars = text.split('');
      let totalWidth = 0;
      for (let i = 0; i < chars.length; i++) {
        totalWidth += ctx.measureText(chars[i]).width + (i < chars.length - 1 ? letterSpacing : 0);
      }
      let currentX = x - totalWidth / 2;
      for (let i = 0; i < chars.length; i++) {
        const char = chars[i];
        ctx.fillText(char, currentX + ctx.measureText(char).width / 2, y);
        currentX += ctx.measureText(char).width + letterSpacing;
      }
    }

    async function generate() {
      log('Loading fonts and textures...');
      await Promise.allSettled([
        document.fonts.load('400 36px Mali'),
        document.fonts.load('500 38px Mali'),
        document.fonts.load('600 48px Mali'),
        document.fonts.load('600 72px Mali')
      ]);
      await document.fonts.ready;
      await loadAllPapers();

      // Preload baked backdrops and title assets
      log('Preloading backdrop assets and handwritten frames...');
      const backdropFiles = ['dawn-portrait.webp', 'noon-portrait.webp', 'dusk-portrait.webp', 'midnight-portrait.webp'];
      await Promise.all(backdropFiles.map(f => loadImg(`../assets/backdrops/${f}`).catch(() => null)));

      const frameImg = await loadImg('../assets/title/drawinghand01.webp');
      const foilImg = await loadImg('../assets/title/foil.webp');

      log('Baking high-resolution handwritten cord lettering...');
      const layer = Object.assign(document.createElement('canvas'), { width: 800, height: 760 });
      const ink = layer.getContext('2d');
      ink.drawImage(frameImg, 0, 0);
      ink.putImageData(cordPixels(ink.getImageData(0, 0, 800, 760)), 0, 0);

      const letteringCanvas = Object.assign(document.createElement('canvas'), { width: 800, height: 760 });
      const cordCtx = letteringCanvas.getContext('2d');
      cordCtx.shadowColor = '#3a27194d';
      cordCtx.shadowBlur = 4;
      cordCtx.shadowOffsetX = 1;
      cordCtx.shadowOffsetY = 3;
      cordCtx.drawImage(layer, 0, 0);

      log('Baking luminous pastelized foil card plate...');
      const cardW = 1680;
      const cardH = 1420;
      const cardCanvas = Object.assign(document.createElement('canvas'), { width: cardW, height: cardH });
      const cctx = cardCanvas.getContext('2d');

      // 1. Draw foil mask silhouette
      cctx.drawImage(foilImg, 0, 0, cardW, cardH);

      // 2. Composite radiant pastel wash (soft morning blush, warm ivory, pale sage, ethereal lavender)
      cctx.globalCompositeOperation = 'source-in';
      const pastelGrad = cctx.createLinearGradient(0, 0, cardW, cardH);
      pastelGrad.addColorStop(0, '#fdf7f2');     // soft morning rose / ivory
      pastelGrad.addColorStop(0.35, '#fafbf5');  // creamy sunlit linen
      pastelGrad.addColorStop(0.70, '#f4f8f4');  // pale meadow sage
      pastelGrad.addColorStop(1, '#f3effa');     // gentle dusk lavender
      cctx.fillStyle = pastelGrad;
      cctx.fillRect(0, 0, cardW, cardH);

      // 3. Very gentle foil shimmer & deckled crease relief (soft-light at low opacity, keeping it light & airy)
      cctx.globalCompositeOperation = 'soft-light';
      cctx.globalAlpha = 0.22;
      cctx.drawImage(foilImg, 0, 0, cardW, cardH);

      // 4. Delicate paper texture highlight
      cctx.globalCompositeOperation = 'overlay';
      cctx.globalAlpha = 0.08;
      cctx.drawImage(foilImg, 0, 0, cardW, cardH);

      cctx.globalAlpha = 1.0;
      cctx.globalCompositeOperation = 'source-over';

      log('Rendering 3000x3000 four-hour torn paper meadow backdrop...');
      const bgCanvas = Object.assign(document.createElement('canvas'), { width: 3000, height: 3000 });
      const sctx = bgCanvas.getContext('2d');
      const flat = sctx.createLinearGradient(0, 0, 3000, 0);
      HOURS.forEach((hour, i) => flat.addColorStop((i + 0.5) / 4, CHAPTER_PALETTES[hour].middle));
      sctx.fillStyle = flat;
      sctx.fillRect(0, 0, 3000, 3000);

      const slant = 3000 * 0.16; // 480
      const band = 3000 / 4;     // 750
      const rand = lcg(31);
      const scale = 1;

      for (let i = 0; i < HOURS.length; i++) {
        const x0 = Math.floor(i * band - slant - 14 * scale);
        const bw = Math.ceil(band + 2 * slant + 28 * scale);
        const paper = hourSheet(HOURS[i], bw, 3000);
        sctx.save();
        sctx.beginPath();
        const steps = 36;
        for (let s = 0; s <= steps; s++) {
          const y = (s / steps) * 3000;
          const x = i === 0 ? -20 : i * band + slant * (1 - 2 * s / steps) + (rand() - 0.5) * 12 * scale;
          if (s === 0) sctx.moveTo(x, y); else sctx.lineTo(x, y);
        }
        sctx.lineTo(3020, 3000); sctx.lineTo(3020, 0); sctx.closePath();
        if (i > 0) {
          sctx.shadowColor = 'rgba(30, 24, 20, 0.38)';
          sctx.shadowBlur = 14 * scale;
          sctx.shadowOffsetX = -4 * scale;
          sctx.fillStyle = CHAPTER_PALETTES[HOURS[i]].middle;
          sctx.fill();
          sctx.shadowColor = 'transparent';
        }
        sctx.clip();
        sctx.drawImage(paper, x0, 0);
        if (i === HOURS.length - 1) sctx.drawImage(paper, x0 + bw - 2, 0);
        sctx.restore();
      }

      // Drawn enclosing cord loop
      log('Drawing enclosing cord loop...');
      sctx.save();
      sctx.lineCap = 'round'; sctx.lineJoin = 'round';
      sctx.shadowColor = 'rgba(30, 24, 20, 0.42)';
      sctx.shadowBlur = 8;
      sctx.shadowOffsetY = 4;
      sctx.strokeStyle = CHAPTER_PALETTES.dawn.balanced;
      sctx.lineWidth = 20;
      loopPath(sctx, 1500, 1500, 1140, 1020, lcg(7));
      sctx.stroke();
      sctx.restore();

      // Draw the 6 fliers orbiting gracefully around the loop with FULLY OPEN WINGS
      log('Drawing six meadow inhabitants in flight (all wings fully open)...');
      const fliers = FLIERS.map((kind, i) => Object.assign(new Insect(0, 0, kind), {
        lacePhase: 'travel',
        glowOffset: i * 0.5,
        turn: i / FLIERS.length
      }));
      const u = 3000, size = u / 340; // ~8.8 scale for crisp, prominent insects
      const rx = 1240, ry = 1120;
      const t = 2.45; // Balanced harmonic position around loop
      for (const flier of fliers) {
        const pace = 0.05 + flier.turn * 0.02;
        const at = (time) => {
          const a = (flier.turn + time * pace) * Math.PI * 2;
          const k = 1 + 0.08 * Math.sin(time * 0.6 + flier.turn * 20);
          return [1500 + Math.cos(a) * rx * k, 1500 + Math.sin(a) * ry * k];
        };
        const [x, y] = at(t), [nx, ny] = at(t + 0.05);
        flier.heading = Math.atan2(ny - y, nx - x);

        // ENSURE ALL INSECT WINGS ARE FULLY OPEN:
        if (flier.kind === 'brimstone') {
          flier.flapPhase = 0; // wingSpread = 0.2 + 0.8 * cos(0) = 1.0 (max spread)
        } else if (flier.kind === 'damselfly') {
          flier.flapPhase = 0; // wingAngle1 = 0, fore & hind wings extended wide
        } else if (flier.kind === 'hawkmoth') {
          flier.flapPhase = Math.PI / 2; // spread = 0.4 + 0.6 * sin(PI/2) = 1.0 (max delta wings)
        } else if (flier.kind === 'hoverfly') {
          flier.flapPhase = Math.PI / 2; // flutter = 0.86 + 0.14 * sin(PI/2) = 1.0 (max width)
        } else if (flier.kind === 'lacewing') {
          flier.lacePhase = 'travel';
          flier.flapPhase = 0; // spread = 0.6 + 0.4 * cos(0) = 1.0 (max veined wing spread)
        } else if (flier.kind === 'firefly') {
          flier.flapPhase = 0;
          flier.stateTime = 0.4; // peak golden glowing lantern halo
          flier.glowOffset = 0;
        }

        sctx.save();
        sctx.translate(x, y);
        sctx.scale(size, size);
        flier.x = 0; flier.y = 0;
        flier.draw(sctx);
        sctx.restore();
      }

      // 1. PRIMARY COVER (with pastel card plate & high-contrast elegant typography)
      log('Compositing Primary Album Cover (3000x3000)...');
      const cover1 = Object.assign(document.createElement('canvas'), { width: 3000, height: 3000 });
      const ctx1 = cover1.getContext('2d');
      ctx1.drawImage(bgCanvas, 0, 0);

      ctx1.save();
      ctx1.translate(1500, 1500);
      ctx1.rotate(-0.7 * Math.PI / 180);
      ctx1.shadowColor = 'rgba(36, 30, 24, 0.22)';
      ctx1.shadowBlur = 52;
      ctx1.shadowOffsetX = 0;
      ctx1.shadowOffsetY = 24;
      ctx1.drawImage(cardCanvas, -cardW / 2, -cardH / 2, cardW, cardH);

      const titleW = 1200;
      const titleH = titleW * (760 / 800);
      const titleX = -titleW / 2;
      const titleY = -cardH / 2 + 105;
      ctx1.shadowColor = 'transparent';
      ctx1.drawImage(letteringCanvas, titleX, titleY, titleW, titleH);

      ctx1.textAlign = 'center';
      ctx1.textBaseline = 'middle';
      ctx1.font = '600 50px Mali, sans-serif';
      ctx1.fillStyle = '#22483f'; // Deep botanical evergreen for clear legibility
      drawLetterspacedText(ctx1, 'ORIGINAL SOUNDTRACK', 0, titleY + titleH - 24, 15);

      ctx1.font = '500 40px Mali, sans-serif';
      ctx1.fillStyle = '#5c385b'; // Deep dusk plum for clear legibility
      drawLetterspacedText(ctx1, 'XYH TAMURA', 0, titleY + titleH + 54, 18);
      ctx1.restore();

      // 2. CLEAN ART COVER (pure title screen art, zero secondary text)
      log('Compositing Clean Art Cover (3000x3000)...');
      const cover2 = Object.assign(document.createElement('canvas'), { width: 3000, height: 3000 });
      const ctx2 = cover2.getContext('2d');
      ctx2.drawImage(bgCanvas, 0, 0);

      ctx2.save();
      ctx2.translate(1500, 1500);
      ctx2.rotate(-0.7 * Math.PI / 180);
      ctx2.shadowColor = 'rgba(36, 30, 24, 0.28)';
      ctx2.shadowBlur = 48;
      ctx2.shadowOffsetX = 0;
      ctx2.shadowOffsetY = 24;
      ctx2.drawImage(cardCanvas, -cardW / 2, -cardH / 2, cardW, cardH);

      const cleanTitleW = 1280;
      const cleanTitleH = cleanTitleW * (760 / 800);
      const cleanTitleX = -cleanTitleW / 2;
      const cleanTitleY = -cleanTitleH / 2;
      ctx2.shadowColor = 'transparent';
      ctx2.drawImage(letteringCanvas, cleanTitleX, cleanTitleY, cleanTitleW, cleanTitleH);
      ctx2.restore();

      // Save covers to server
      log('Saving primary cover (cover.png)...');
      const blob1 = await new Promise(r => cover1.toBlob(r, 'image/png'));
      await fetch('/api/save_cover?name=cover.png', { method: 'POST', body: blob1 });

      log('Saving clean art cover (cover-clean.png)...');
      const blob2 = await new Promise(r => cover2.toBlob(r, 'image/png'));
      await fetch('/api/save_cover?name=cover-clean.png', { method: 'POST', body: blob2 });

      log('[OK] Both album covers generated and saved!');
      await fetch('/api/done', { method: 'POST' });
    }

    generate().catch(err => {
      log('\nERROR: ' + err.stack);
      fetch('/api/error', { method: 'POST', body: err.stack }).catch(() => {});
    });
  </script>
</body>
</html>
