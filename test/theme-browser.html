<!doctype html>
<meta charset="utf-8">
<title>Chapter palette browser check</title>
<style>body{margin:0}iframe{width:100%;height:1050px;border:0}pre{white-space:pre-wrap}</style>
<pre id="result">RUNNING</pre>
<iframe src="../index.html"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const params = new URLSearchParams(location.search);
if (params.has('width')) frame.style.width = `${Number(params.get('width'))}px`;
const check = (value, message) => { if (!value) throw new Error(message); };
async function ready() {
  for (let i = 0; !frame.contentWindow.game && i < 200; i++) await new Promise(r => setTimeout(r, 20));
  check(frame.contentWindow.game, 'Game did not initialize');
  frame.contentWindow.document.getElementById('btn-begin')?.click();
  return frame.contentWindow;
}
try {
  await new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  let w = await ready();
  const button = () => w.document.getElementById('btn-color-mode');
  if (button().getAttribute('aria-pressed') === 'true') button().click();
  for (const hour of ['dawn','noon','dusk','midnight']) {
    const game = w.game;
    game.startLevel(`${hour}-01`);
    game.state = 'READY'; game.render();
    const before = game[`${hour}Art`].toDataURL();
    const entities = game.entities;
    button().click();
    check(w.document.documentElement.dataset.colorMode === 'light', 'Light mode missing');
    check(!w.document.documentElement.style.getPropertyValue('--panel-bg'), 'Light CSS not restored');
    check(game[`${hour}Art`].toDataURL() !== before, `${hour}: cached art did not change`);
    check(game.entities === entities && game.state === 'READY', 'Toggle reset visit');
    button().click();
    check(game[`${hour}Art`].toDataURL() === before, `${hour}: default did not restore exactly`);
  }
  button().click();
  const loaded = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  frame.contentWindow.location.reload(); await loaded; w = await ready();
  check(button().getAttribute('aria-pressed') === 'true', 'Mode did not survive reload');
  w.game.startLevel('midnight-01');
  check(w.document.documentElement.dataset.colorMode === 'light', 'Chapter change reset mode');
  if (!new URLSearchParams(location.search).has('light')) button().click();
  w.game.state = new URLSearchParams(location.search).has('field') ? 'PLAYING' : 'READY';
  w.game.render();
  check(w.document.documentElement.scrollWidth <= w.innerWidth, 'Page overflows horizontally');
  document.getElementById('result').textContent = 'PASS: four chapter switches, cache refresh, exact restoration, visit preservation, reload persistence';
} catch (error) {
  document.getElementById('result').textContent = `FAIL: ${error.stack}`;
}
</script>
